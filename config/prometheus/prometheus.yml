global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'webhook-listener'
    static_configs:
      - targets: ['webhook-listener:8000']
    metrics_path: /metrics

  # Hyperledger Fabric metrics (if exposed)
  - job_name: 'fabric-peer'
    static_configs:
      - targets: ['peer0.org1.example.com:9443', 'peer0.org2.example.com:9443']
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
