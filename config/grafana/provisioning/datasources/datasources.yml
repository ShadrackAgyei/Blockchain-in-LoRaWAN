apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: MySQL
    type: mysql
    url: mysql:3306
    database: lorawan_events
    user: lorawan
    secureJsonData:
      password: lorawan
    editable: false
